# Copy to /etc/bouncer/config.toml and adjust values.

[crawl]
interval_secs = 86400
timeout_secs = 10
max_pages = 500
max_depth = 5
user_agent = "Bouncer/1.0 (+https://github.com/Normal66/Bouncer)"

[logs]
format = "caddy" # caddy | nginx
poll_interval_ms = 500

[[sites]]
name = "example"
base_url = "https://example.com"
log_path = "/var/log/caddy/example.com.access.log"
extra_paths = ["/api/health", "/robots.txt", "/favicon.ico"]

# Add more sites:
# [[sites]]
# name = "other"
# base_url = "https://other.example"
# log_path = "/var/log/caddy/other.example.access.log"

[ban]
threshold = 5
window_secs = 60
ban_duration_secs = 3600
# dry_run = true

[web.probes]
enabled = true
# Instant ban on known scanner paths (no crawl required)
paths = [
  "/.env",
  "/.git/config",
  "/.git/HEAD",
  "/.aws/credentials",
  "/wp-login.php",
  "/wp-admin",
  "/xmlrpc.php",
  "/phpmyadmin",
  "/pma",
  "/admin/config.php",
  "/vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php",
  "/config.json",
  "/actuator",
  "/server-status",
]

[web.auth]
enabled = true
# 401/403 on these path prefixes → threshold ban
prefixes = ["/admin", "/login", "/wp-login.php", "/wp-admin", "/api/login", "/api/auth", "/user/login"]
threshold = 5
window_secs = 60

[ssh]
enabled = false
unit = "ssh" # use "sshd" on RHEL/Fedora
threshold = 3   # only for Failed password on existing usernames
window_secs = 120
# Invalid user → instant ban (no threshold)

[mail]
enabled = false
units = ["postfix", "dovecot"] # only units listed here are monitored
threshold = 3
window_secs = 120
# Unknown user / invalid recipient → instant ban

[nft]
# Merge set into your existing inet filter table (see examples/nftables/setup.nft)
table = "inet filter"
set = "blocked_ips"
timeout = "1h"

[whitelist]
ips = ["127.0.0.1", "::1"]
cidrs = ["10.0.0.0/8", "192.168.0.0/16"]
