# Copy to /etc/caddyban/config.toml and adjust values.

[crawl]
interval_secs = 86400
timeout_secs = 10
max_pages = 500
max_depth = 5
user_agent = "CaddyBan/0.3 (+https://github.com/Normal66/CaddyBan)"

[logs]
format = "caddy" # caddy | nginx
poll_interval_ms = 500

[[sites]]
name = "example"
base_url = "https://example.com"
log_path = "/var/log/caddy/example.com.access.log"
extra_paths = ["/api/health", "/robots.txt", "/favicon.ico"]

# Add more sites:
# [[sites]]
# name = "other"
# base_url = "https://other.example"
# log_path = "/var/log/caddy/other.example.access.log"

[ban]
threshold = 5
window_secs = 60
ban_duration_secs = 3600
# dry_run = true

[ssh]
enabled = false
unit = "ssh" # use "sshd" on RHEL/Fedora
threshold = 3   # only for Failed password on existing usernames
window_secs = 120
# Invalid user → instant ban (no threshold)

[nft]
# Merge set into your existing inet filter table (see examples/nftables/setup.nft)
table = "inet filter"
set = "blocked_ips"
timeout = "1h"

[whitelist]
ips = ["127.0.0.1", "::1"]
cidrs = ["10.0.0.0/8", "192.168.0.0/16"]
