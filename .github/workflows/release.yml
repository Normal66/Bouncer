name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: bouncer-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: bouncer-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary (static musl)
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/bouncer

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bouncer-linux-amd64
          path: artifacts/bouncer-linux-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bouncer-linux-arm64
          path: artifacts/bouncer-linux-arm64

      - name: Prepare release assets
        run: |
          mkdir -p dist
          ls -laR artifacts/
          cp artifacts/bouncer-linux-amd64/bouncer dist/bouncer-linux-amd64
          cp artifacts/bouncer-linux-arm64/bouncer dist/bouncer-linux-arm64
          chmod 755 dist/*
          ls -la dist/

      - name: Verify static musl binaries
        run: |
          file dist/bouncer-linux-amd64
          file dist/bouncer-linux-arm64
          ldd dist/bouncer-linux-amd64 2>&1 | grep -q 'not a dynamic executable'
          ldd dist/bouncer-linux-arm64 2>&1 | grep -q 'not a dynamic executable'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bouncer-linux-amd64
            dist/bouncer-linux-arm64
            install.sh
          generate_release_notes: true
