name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: bouncer-linux-amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: bouncer-linux-arm64
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/bouncer

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bouncer-linux-amd64
          path: artifacts/bouncer-linux-amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bouncer-linux-arm64
          path: artifacts/bouncer-linux-arm64

      - name: Prepare release assets
        run: |
          mkdir -p dist
          ls -laR artifacts/
          cp artifacts/bouncer-linux-amd64/bouncer dist/bouncer-linux-amd64
          cp artifacts/bouncer-linux-arm64/bouncer dist/bouncer-linux-arm64
          chmod 755 dist/*
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bouncer-linux-amd64
            dist/bouncer-linux-arm64
            install.sh
          generate_release_notes: true
